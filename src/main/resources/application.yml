spring:
  application:
    name: knowledge-graph-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kg}
    username: ${DB_USER:kg}
    password: ${DB_PASS:kg}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# SECURITY FIX: expose only health,info. "include: *" leaked /actuator/env,
management:
  endpoints:
    web:
      exposure:
        include: health,info

# SECURITY FIX: admin token comes from the environment, never from code.
# In the cluster it is provided via a Kubernetes Secret (ADMIN_TOKEN).
admin:
  token: ${ADMIN_TOKEN:}

server:
  port: 8080

name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & unit tests
        run: mvn -B verify

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Прогон 1: человеко-читаемые findings прямо в лог джобы
      - name: Semgrep (SAST) — findings в лог
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep \
            semgrep scan --config /src/.semgrep/custom.yml \
                         --config p/java --config p/owasp-top-ten \
                         --error -- /src \
            || echo "semgrep findings, exit=$?"

      # Прогон 2: SARIF-отчёт в артефакт (пишем в /src = смонтированный PWD!)
      - name: Semgrep (SAST) — SARIF в артефакт
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep \
            semgrep scan --config /src/.semgrep/custom.yml \
                         --config p/java --config p/owasp-top-ten \
                         --sarif --output /src/semgrep.sarif -- /src \
            || echo "sarif written"

      - name: SpotBugs (SAST, bytecode)
        run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:spotbugs || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sast-reports
          path: |
            target/spotbugsXml.xml
            semgrep.sarif

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: "OSV-Scanner (SCA: CVE в зависимостях)"
        run: |
          docker run --rm -v "${PWD}:/src" ghcr.io/google/osv-scanner:v1.9.1 \
            --lockfile=/src/pom.xml --format=markdown || echo "osv findings, exit=$?"

  image:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $REGISTRY/${{ github.repository }}:$TAG \
                       -t $REGISTRY/${{ github.repository }}:latest .
          docker push $REGISTRY/${{ github.repository }}:$TAG
          docker push $REGISTRY/${{ github.repository }}:latest
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

  deploy:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo (kvm-k8s-lab)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sadqwes/kvm-k8s-lab
          token: ${{ secrets.KVM_LAB_PAT }}
      - name: Update image tag in gitops
        run: |
          TAG=${GITHUB_SHA::7}
          sed -i "s|image: ghcr.io/sadqwes/knowledge-graph-api:.*|image: ghcr.io/sadqwes/knowledge-graph-api:$TAG|" \
            gitops/platform/knowledge-graph/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@sadqwes.local"
          git add gitops/platform/knowledge-graph/deployment.yaml
          git commit -m "chore(deploy): knowledge-graph-api $TAG" && git push || echo "no changes to deploy"

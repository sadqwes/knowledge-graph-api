name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & unit tests
        run: mvn -B verify

  sast:
    runs-on: ubuntu-latest
    continue-on-error: true   # УЧЕБНАЯ ФАЗА: гейт сообщает, но не блокирует. После фиксов убрать.
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (SAST)
        run: |
          docker run --rm -v "${PWD}:/src" semgrep/semgrep \
            semgrep scan --config p/java --config p/owasp-top-ten \
            --error --sarif /tmp/semgrep.sarif /src || echo "semgrep findings, exit=$?"
      - name: SpotBugs (SAST, bytecode)
        run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:spotbugs
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            target/spotbugsXml.xml

  sca:
    runs-on: ubuntu-latest
    continue-on-error: true   # УЧЕБНАЯ ФАЗА
    steps:
      - uses: actions/checkout@v4
      - name: "OSV-Scanner (SCA: CVE в зависимостях)"
        run: |
          docker run --rm -v "${PWD}:/src" ghcr.io/google/osv-scanner:v1.9.1 \
            --lockfile=/src/pom.xml --format=markdown || echo "osv findings, exit=$?"

  image:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          TAG=${GITHUB_SHA::7}
          docker build -t $REGISTRY/${{ github.repository }}:$TAG \
                       -t $REGISTRY/${{ github.repository }}:latest .
          docker push $REGISTRY/${{ github.repository }}:$TAG
          docker push $REGISTRY/${{ github.repository }}:latest
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

  deploy:
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repo (kvm-k8s-lab)
        uses: actions/checkout@v4
        with:
          repository: sadqwes/kvm-k8s-lab
          token: ${{ secrets.KVM_LAB_PAT }}
      - name: Update image tag in gitops
        run: |
          TAG=${GITHUB_SHA::7}
          sed -i "s|image: ghcr.io/sadqwes/knowledge-graph-api:.*|image: ghcr.io/sadqwes/knowledge-graph-api:$TAG|" \
            gitops/platform/knowledge-graph/deployment.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@sadqwes.local"
          git add gitops/platform/knowledge-graph/deployment.yaml
          git commit -m "chore(deploy): knowledge-graph-api $TAG" && git push || echo "no changes to deploy"
